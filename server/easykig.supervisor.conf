[program:easykig]
command=/data/EasyKig/.venv/bin/python /data/EasyKig/scripts/run_gateway.py
directory=/data/EasyKig
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/data/EasyKig/runtime/gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"
